<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JobSeed Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

<style>

/* ================= DESIGN SYSTEM ================= */
:root{
--primary:#16a34a;
--bg:#f0fdf4;
--card:#ffffff;
--text:#052e16;
--shadow:0 10px 25px rgba(0,0,0,0.08);
}

/* ================= GLOBAL ================= */
body{
margin:0;
font-family:'Inter',sans-serif;
background:linear-gradient(135deg,#f0fdf4,#dcfce7,#bbf7d0);
color:var(--text);
}

h1,h2,h3{
font-family:'Space Grotesk',sans-serif;
}

/* ================= NAVBAR ================= */
.navbar{
display:flex;
justify-content:space-between;
padding:18px 30px;
background:rgba(255,255,255,0.8);
backdrop-filter:blur(10px);
position:sticky;
top:0;
z-index:1000;
}

.logo{
font-weight:700;
font-size:20px;
color:var(--primary);
}

.btn{
background:var(--primary);
color:white;
padding:10px 16px;
border-radius:10px;
border:none;
cursor:pointer;
font-weight:600;
}

/* ================= LAYOUT ================= */
.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.layout{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

/* ================= JOB GRID ================= */
.job-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:16px;
}

/* ================= CARD ================= */
.card{
background:var(--card);
border-radius:16px;
box-shadow:var(--shadow);
overflow:hidden;
transition:0.25s;
}

.card:hover{
transform:translateY(-6px);
}

.card img{
width:100%;
height:140px;
object-fit:cover;
}

.card-content{
padding:12px;
}

.card-title{
font-weight:600;
}

.card-sub{
font-size:13px;
color:#555;
}

.actions{
margin-top:8px;
display:flex;
gap:6px;
flex-wrap:wrap;
}

/* ================= MAP ================= */
.map-box{
background:white;
padding:12px;
border-radius:12px;
margin-top:10px;
box-shadow:var(--shadow);
}

/* ================= CHAT ================= */
.popup{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.4);
justify-content:center;
align-items:center;
}

.chat{
background:white;
width:90%;
max-width:600px;
border-radius:12px;
overflow:hidden;
}

.chat-header{
display:flex;
justify-content:space-between;
padding:12px;
border-bottom:1px solid #eee;
}

.msg{
padding:8px;
border-radius:10px;
margin:6px;
max-width:70%;
}

.user{background:#16a34a;color:white;margin-left:auto;}
.business{background:#eee;}

.chat-messages{
height:300px;
overflow-y:auto;
padding:10px;
}

</style>
</head>

<body>

<div class="navbar">
<div class="logo">JobSeed</div>
<div>
<button class="btn" onclick="toggleChat()">Chat</button>
<button class="btn" onclick="toggleMap()">Map</button>
</div>
</div>

<div class="container">

<input placeholder="Search..." onkeyup="searchJobs(this.value)">
<button class="btn" onclick="sortJobs('pay')">Top Pay</button>
<button class="btn" onclick="sortJobs('rating')">Top Rated</button>

<div class="layout">

<div class="job-grid" id="jobList"></div>

<div id="mapContainer">Map hidden</div>

</div>

</div>

<!-- CHAT -->
<div id="chatPopup" class="popup">
<div class="chat">
<div class="chat-header">
<b>Chat</b>
<button onclick="toggleChat()">Close</button>
</div>
<div id="chatMessages" class="chat-messages"></div>
<input id="msgInput">
<button onclick="sendMsg()">Send</button>
</div>
</div>

<script>

/* ================= DATA ================= */
const jobs = Array.from({length:10},(_,i)=>({
title:["Barista","Retail","Hotel","Waiter","Cleaner","Delivery","Spa","Cashier","Kitchen","Assistant"][i],
company:["Cafe Amazon","Central Mall","Hilton","Beach Restaurant","CleanCo","Grab","Spa Relax","7-Eleven","Seafood","Office"][i],
pay:400+i*50,
rating:4+Math.random(),
lat:12.68+(Math.random()-0.5)/50,
lng:101.28+(Math.random()-0.5)/50,
img:`https://source.unsplash.com/400x300/?business,job,${i}`
}));

let selected=null;
let mapVisible=false;
let chats=[];

/* ================= RENDER ================= */
function renderJobs(list){
jobList.innerHTML=list.map(j=>`
<div class="card">
<img src="${j.img}">
<div class="card-content">
<div class="card-title">${j.title}</div>
<div class="card-sub">${j.company}</div>
<div>฿${j.pay}</div>

<div class="actions">
<button class="btn" onclick='selectJob(${JSON.stringify(j)})'>Map</button>
<button class="btn">Apply</button>
</div>

</div>
</div>
`).join("");
}

/* ================= MAP ================= */
function selectJob(j){
selected=j;
renderMap();
}

function toggleMap(){
mapVisible=!mapVisible;
renderMap();
}

function renderMap(){
if(!mapVisible || !selected){
mapContainer.innerHTML="Map hidden";
return;
}

mapContainer.innerHTML=`
<iframe width="100%" height="300"
src="https://www.google.com/maps?q=${selected.lat},${selected.lng}&output=embed"></iframe>

<div class="map-box">
<b>${selected.company}</b><br>
${selected.title}<br>
<button class="btn" onclick="openMaps(${selected.lat},${selected.lng})">Open</button>
</div>
`;
}

function openMaps(lat,lng){
window.open(`https://www.google.com/maps?q=${lat},${lng}`);
}

/* ================= SORT ================= */
function sortJobs(type){
let sorted=[...jobs];
if(type==="pay") sorted.sort((a,b)=>b.pay-a.pay);
if(type==="rating") sorted.sort((a,b)=>b.rating-a.rating);
renderJobs(sorted);
}

/* ================= CHAT ================= */
function toggleChat(){
chatPopup.style.display=chatPopup.style.display==="flex"?"none":"flex";
}

function sendMsg(){
let text=msgInput.value;
if(!text)return;

chats.push({text,type:"user"});
chats.push({text:"We will respond shortly",type:"business"});

msgInput.value="";
renderChat();
}

function renderChat(){
chatMessages.innerHTML=chats.map(m=>`
<div class="msg ${m.type}">${m.text}</div>
`).join("");
}

/* ================= SEARCH ================= */
function searchJobs(q){
renderJobs(jobs.filter(j=>j.title.toLowerCase().includes(q.toLowerCase())));
}

/* INIT */
renderJobs(jobs);

</script>

</body>
</html>
