<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobSeed Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<style>
body {
    margin:0;
    font-family:'Inter',sans-serif;
    background:linear-gradient(135deg,#ecfdf5,#dcfce7);
}

/* NAVBAR */
.navbar {
    position:sticky;
    top:0;
    background:white;
    padding:15px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 5px 20px rgba(0,0,0,0.05);
}

/* BUTTON */
.btn {
    padding:10px 16px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#16a34a,#22c55e);
    color:white;
    font-weight:600;
    display:inline-flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
    box-shadow:0 6px 20px rgba(34,197,94,0.3);
    transition:0.25s;
}
.btn:hover {
    transform:translateY(-2px);
}

/* HERO */
.hero {
    text-align:center;
    padding:60px 20px;
}
.hero h1 {
    font-size:42px;
}
.hero span { color:#16a34a; }

/* LAYOUT */
.container { max-width:1200px; margin:auto; padding:20px; }
.layout { display:flex; gap:20px; }
#jobList { width:50%; }
#mapContainer { width:50%; }

/* CARD */
.card {
    background:white;
    border-radius:18px;
    padding:14px;
    margin-bottom:12px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
    transition:0.3s;
}
.card:hover {
    transform:translateY(-6px);
}
.card img {
    width:100%;
    height:140px;
    object-fit:cover;
    border-radius:10px;
}

/* POPUP */
.popup {
    display:none;
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    background:rgba(0,0,0,0.4);
    justify-content:center;
    align-items:center;
}
.popup-box {
    background:white;
    padding:20px;
    border-radius:16px;
    width:90%;
    max-width:700px;
}

/* CHAT */
.chat-style { display:flex; height:400px; }
.chat-sidebar { width:30%; border-right:1px solid #eee; overflow-y:auto; }
.chat-main { width:70%; display:flex; flex-direction:column; }
.chat-messages { flex:1; padding:10px; overflow-y:auto; }
.msg { padding:8px; border-radius:10px; margin:5px 0; max-width:70%; }
.user { background:#16a34a; color:white; margin-left:auto; }
.business { background:#eee; }

/* MOBILE */
@media(max-width:768px){
.layout { flex-direction:column; }
#jobList,#mapContainer { width:100%; }
}
</style>
</head>

<body>

<div class="navbar">
<b>JobSeed Pro</b>

<div>
<button class="btn" onclick="signup()">
<i data-lucide="user-plus"></i> Sign Up
</button>

<button class="btn" onclick="login()">
<i data-lucide="log-in"></i> Login
</button>

<button class="btn" onclick="toggleApps()">
<i data-lucide="file-text"></i> Apps
</button>

<button class="btn" onclick="toggleChat()">
<i data-lucide="message-circle"></i> Chat
</button>
</div>
</div>

<div class="hero">
<h1>Find Jobs <span>Nearby</span></h1>
<p>Real system • Not just UI</p>
</div>

<div class="container">

<input placeholder="Search jobs..." onkeyup="searchJobs(this.value)">
<button class="btn" onclick="findNearbyJobs()">
<i data-lucide="map-pin"></i> Nearby
</button>

<div class="layout">
<div id="jobList"></div>
<div id="mapContainer"></div>
</div>

</div>

<!-- APPLICATIONS -->
<div id="appsPopup" class="popup">
<div class="popup-box">
<h3>Your Applications</h3>
<div id="appList"></div>
<button class="btn" onclick="toggleApps()">Close</button>
</div>
</div>

<!-- APPLY -->
<div id="applyPopup" class="popup">
<div class="popup-box">
<h3>Apply</h3>
<input placeholder="Your Name">
<input placeholder="Why hire you?">
<input placeholder="Hours">
<button class="btn" onclick="submitApplication()">Submit</button>
<button class="btn" onclick="closeApply()">Cancel</button>
</div>
</div>

<!-- CHAT -->
<div id="chatPopup" class="popup">
<div class="popup-box chat-style">
<div id="chatUsers" class="chat-sidebar"></div>

<div class="chat-main">
<div id="chatMessages" class="chat-messages"></div>
<div>
<input id="msgInput">
<button class="btn" onclick="sendMsg()">Send</button>
</div>
</div>

<button class="btn" onclick="toggleChat()">Close</button>
</div>
</div>

<script>

// DATABASE
let db = JSON.parse(localStorage.getItem("db")) || {
users:[],currentUser:null,applications:[],chats:{}};

function saveDB(){
localStorage.setItem("db",JSON.stringify(db));
}

// AUTH
function signup(){
let name=prompt("Username");
if(!name)return;
db.users.push({name});
db.currentUser=name;
saveDB();
alert("Signed up");
}

function login(){
let name=prompt("Username");
if(db.users.find(u=>u.name===name)){
db.currentUser=name;
saveDB();
alert("Logged in");
}
}

// JOBS
const jobs=Array.from({length:10},(_,i)=>({
title:["Barista","Retail","Hotel","Waiter","Cleaner","Delivery","Dog Walker","Spa","Cashier","Kitchen"][i],
company:"Company "+(i+1),
pay:"฿"+(400+i*50),
rating:4+Math.random(),
reviews:Math.floor(Math.random()*50),
lat:12.9+Math.random()/10,
lng:100.8+Math.random()/10,
img:"https://picsum.photos/300?"+i
}));

let selectedJob=null;
let currentChat=null;

// RENDER
function renderJobs(list){
jobList.innerHTML=list.map(j=>`
<div class="card">
<img src="${j.img}">
<b>${j.title}</b><br>
${j.company}<br>
${j.pay}<br>
⭐ ${"★".repeat(Math.round(j.rating))}<br>
<button class="btn" onclick='applyJob(${JSON.stringify(j)})'>
<i data-lucide="send"></i> Apply
</button>
</div>`).join("");
lucide.createIcons();
}

// APPLY
function applyJob(job){
selectedJob=job;
applyPopup.style.display="flex";
}

function closeApply(){
applyPopup.style.display="none";
}

function submitApplication(){
if(!selectedJob||!db.currentUser){
alert("Login first");
return;
}

db.applications.push({
user:db.currentUser,
job:selectedJob,
status:"pending"
});

saveDB();
closeApply();
renderApps();
simulateDecision(selectedJob.company);
}

// AI
function simulateDecision(company){
setTimeout(()=>{
db.applications.forEach(a=>{
if(a.job.company===company && a.status==="pending"){
a.status=Math.random()>0.5?"accepted":"rejected";
}
});
saveDB();
renderApps();
},3000);
}

// APPS
function renderApps(){
let list=db.applications.filter(a=>a.user===db.currentUser);
appList.innerHTML=list.map(a=>`
<div>
${a.job.title} - ${a.status}
</div>`).join("");
}

// CHAT
function renderUsers(){
chatUsers.innerHTML=db.applications.map(a=>`
<div onclick="openChat('${a.job.company}')">${a.job.company}</div>
`).join("");
}

function openChat(name){
currentChat=name;
let key=db.currentUser+"_"+name;
chatMessages.innerHTML=(db.chats[key]||[]).map(m=>`
<div class="msg ${m.type}">${m.text}</div>
`).join("");
}

function sendMsg(){
let text=msgInput.value;
if(!text||!currentChat||!db.currentUser)return;

let key=db.currentUser+"_"+currentChat;
if(!db.chats[key])db.chats[key]=[];

db.chats[key].push({text,type:"user"});
db.chats[key].push({text:"Reply soon",type:"business"});

saveDB();
msgInput.value="";
openChat(currentChat);
}

// UI
function toggleApps(){
appsPopup.style.display=appsPopup.style.display==="flex"?"none":"flex";
renderApps();
}

function toggleChat(){
chatPopup.style.display=chatPopup.style.display==="flex"?"none":"flex";
renderUsers();
}

// SEARCH
function searchJobs(q){
renderJobs(jobs.filter(j=>j.title.toLowerCase().includes(q.toLowerCase())));
}

// LOCATION
function findNearbyJobs(){
navigator.geolocation.getCurrentPosition(pos=>{
showMap(pos.coords.latitude,pos.coords.longitude);
});
}

function showMap(lat,lng){
mapContainer.innerHTML=`<iframe width="100%" height="400" src="https://www.google.com/maps?q=${lat},${lng}&output=embed"></iframe>`;
}

// INIT
renderJobs(jobs);
showMap(12.93,100.88);

</script>

</body>
</html>
