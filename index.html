<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobSeed</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body { font-family: 'Inter', sans-serif; margin:0; background:#f0fdf4; }

.navbar {
    background:white; padding:15px; display:flex;
    justify-content:space-between;
}

.container { max-width:1200px; margin:20px auto; padding:15px; }

.layout {
    display:flex;
    gap:15px;
    margin-top:20px;
}

#jobList {
    width:50%;
    max-height:500px;
    overflow-y:auto;
}

#mapContainer {
    width:50%;
}

.card {
    background:white;
    padding:12px;
    border-radius:12px;
    margin-bottom:10px;
    cursor:pointer;
}

.card img {
    width:100%;
    height:140px;
    object-fit:cover;
    border-radius:10px;
}

button {
    margin-top:10px;
    padding:10px;
    border:none;
    border-radius:10px;
    background:#16a34a;
    color:white;
    cursor:pointer;
}

@media(max-width:768px){
    .layout { flex-direction:column; }
    #jobList, #mapContainer { width:100%; }
}
</style>
</head>

<body>

<div class="navbar">
    <b>🌱 JobSeed</b>
</div>

<div class="container">
    <h1>Jobs</h1>

    <input placeholder="Search jobs..." onkeyup="searchJobs(this.value)">

    <button onclick="findNearbyJobs()">📍 Show Nearby Jobs</button>

    <div class="layout">
        <div id="jobList"></div>
        <div id="mapContainer"></div>
    </div>
</div>

<script>

// JOBS (PATTAYA)
const jobs = [
{title:"Barista Assistant",company:"Cafe Amazon",pay:"฿500/day",lat:12.934,lng:100.889,img:"https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb"},
{title:"Retail Helper",company:"Central Festival",pay:"฿550/day",lat:12.933,lng:100.883,img:"https://images.unsplash.com/photo-1512436991641-6745cdb1723f"},
{title:"Hotel Assistant",company:"Hilton Pattaya",pay:"฿700/day",lat:12.934,lng:100.883,img:"https://images.unsplash.com/photo-1566073771259-6a8506099945"},
{title:"Waiter",company:"Beach Restaurant",pay:"฿600/day",lat:12.931,lng:100.877,img:"https://images.unsplash.com/photo-1559339352-11d035aa65de"}
];

// RENDER JOBS
function renderJobs(list){
    let html="";
    list.forEach((j,i)=>{
        html+=`
        <div class="card" onclick="showOnMap(${j.lat},${j.lng})">
            <img src="${j.img}">
            <b>${j.title}</b><br>
            ${j.company}<br>
            ${j.pay}<br>
            ${j.distance ? "📍 "+j.distance.toFixed(1)+" km away" : ""}
        </div>`;
    });
    jobList.innerHTML=html;
}

// SHOW MAP LOCATION
function showOnMap(lat,lng){
    mapContainer.innerHTML = `
        <iframe
        width="100%"
        height="500"
        style="border-radius:12px"
        src="https://www.google.com/maps?q=${lat},${lng}&z=15&output=embed">
        </iframe>
    `;
}

// SEARCH
function searchJobs(q){
    renderJobs(jobs.filter(j=>j.title.toLowerCase().includes(q.toLowerCase())));
}

// DISTANCE
function getDistance(lat1, lon1, lat2, lon2){
    const R=6371;
    const dLat=(lat2-lat1)*Math.PI/180;
    const dLon=(lon2-lon1)*Math.PI/180;

    const a=Math.sin(dLat/2)**2 +
        Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
        Math.sin(dLon/2)**2;

    return R*(2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)));
}

// NEARBY
function findNearbyJobs(){
    navigator.geolocation.getCurrentPosition(pos=>{
        const userLat=pos.coords.latitude;
        const userLng=pos.coords.longitude;

        let list=jobs.map(j=>{
            const d=getDistance(userLat,userLng,j.lat,j.lng);
            return {...j,distance:d};
        });

        list.sort((a,b)=>a.distance-b.distance);
        renderJobs(list);

        showOnMap(userLat,userLng);

    },()=>alert("Allow location"));
}

// DEFAULT LOAD
renderJobs(jobs);
showOnMap(12.93,100.88);

</script>

</body>
</html>
