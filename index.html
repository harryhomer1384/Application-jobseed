<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobSeed</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body { font-family: 'Inter', sans-serif; margin:0; background:#f0fdf4; }

.navbar {
    background:white; padding:15px;
    display:flex; justify-content:space-between;
}
.navbar a { margin-left:10px; text-decoration:none; color:#16a34a; }

.container { max-width:1200px; margin:20px auto; padding:15px; }

.layout { display:flex; gap:15px; }

#jobList { width:50%; max-height:500px; overflow-y:auto; }
#mapContainer { width:50%; }

.card {
    background:white; padding:12px;
    border-radius:12px; margin-bottom:10px;
    cursor:pointer;
}

.card img {
    width:100%; height:140px;
    object-fit:cover; border-radius:10px;
}

button {
    padding:8px; border:none;
    border-radius:8px;
    background:#16a34a; color:white;
    cursor:pointer;
}

/* APPLICATIONS */
.app-card {
    background:white;
    padding:15px;
    border-radius:12px;
    margin-bottom:10px;
}

.status {
    padding:4px 8px;
    border-radius:8px;
    font-size:12px;
}
.pending { background:orange; color:white; }
.accepted { background:green; color:white; }
.rejected { background:red; color:white; }

/* CHAT */
.chat-container {
    display:flex;
    background:white;
    border-radius:12px;
    overflow:hidden;
}

.chat-list {
    width:30%;
    border-right:1px solid #eee;
}

.chat-user {
    padding:10px;
    cursor:pointer;
}

.chat-box {
    width:70%;
    display:flex;
    flex-direction:column;
}

.chat-messages {
    height:300px;
    overflow-y:auto;
    padding:10px;
}

.msg {
    padding:8px 12px;
    border-radius:10px;
    margin:5px 0;
    max-width:70%;
}

.user { background:#16a34a; color:white; margin-left:auto; }
.business { background:#eee; }

.chat-input { display:flex; }
.chat-input input { flex:1; padding:10px; border:none; }
.chat-input button { padding:10px; }

/* MOBILE */
@media(max-width:768px){
    .layout { flex-direction:column; }
    #jobList, #mapContainer { width:100%; }
}
</style>
</head>

<body>

<div class="navbar">
    <b>🌱 JobSeed</b>
    <div>
        <a href="#jobs">Jobs</a>
        <a href="#applications">Applications</a>
        <a href="#chat">Chat</a>
    </div>
</div>

<!-- JOBS -->
<div id="jobs" class="container">
<h2>Jobs</h2>

<input placeholder="Search..." onkeyup="searchJobs(this.value)">
<button onclick="findNearbyJobs()">📍 Nearby</button>

<div class="layout">
    <div id="jobList"></div>
    <div id="mapContainer"></div>
</div>
</div>

<!-- APPLICATIONS -->
<div id="applications" class="container">
<h2>Applications</h2>
<div id="appList"></div>
</div>

<!-- CHAT -->
<div id="chat" class="container">
<h2>Chat</h2>

<div class="chat-container">
    <div id="chatUsers" class="chat-list"></div>

    <div class="chat-box">
        <div id="chatMessages" class="chat-messages"></div>

        <div class="chat-input">
            <input id="msgInput" placeholder="Message">
            <button onclick="sendMsg()">Send</button>
        </div>
    </div>
</div>
</div>

<script>

const jobs=[
{title:"Barista",company:"Cafe",pay:"฿500",lat:12.93,lng:100.88,img:"https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb"},
{title:"Retail",company:"Mall",pay:"฿550",lat:12.92,lng:100.87,img:"https://images.unsplash.com/photo-1512436991641-6745cdb1723f"}
];

let applications=[];
let chats={};
let currentChat=null;

// JOBS
function renderJobs(list){
let html="";
list.forEach(j=>{
html+=`
<div class="card" onclick="showOnMap(${j.lat},${j.lng})">
<img src="${j.img}">
<b>${j.title}</b><br>${j.company}<br>${j.pay}<br>
<button onclick='applyJob(${JSON.stringify(j)})'>Apply</button>
</div>`;
});
jobList.innerHTML=html;
}

function showOnMap(lat,lng){
mapContainer.innerHTML=`
<iframe width="100%" height="500"
src="https://www.google.com/maps?q=${lat},${lng}&output=embed"></iframe>`;
}

function searchJobs(q){
renderJobs(jobs.filter(j=>j.title.toLowerCase().includes(q.toLowerCase())));
}

// APPLY
function applyJob(job){
applications.push({...job,status:"pending"});
renderApps();
renderUsers();
}

// APPLICATIONS
function renderApps(){
let html="";
applications.forEach(a=>{
html+=`
<div class="app-card">
<b>${a.title}</b><br>${a.company}<br>
<span class="status ${a.status}">${a.status}</span>
</div>`;
});
appList.innerHTML=html;
}

// CHAT USERS
function renderUsers(){
let html="";
applications.forEach(a=>{
html+=`<div class="chat-user" onclick="openChat('${a.company}')">${a.company}</div>`;
});
chatUsers.innerHTML=html;
}

// CHAT
function openChat(name){
currentChat=name;
chatMessages.innerHTML="";
(chats[name]||[]).forEach(m=>{
chatMessages.innerHTML+=`<div class="msg ${m.type}">${m.text}</div>`;
});
}

function sendMsg(){
let text=msgInput.value;
if(!text||!currentChat)return;

if(!chats[currentChat])chats[currentChat]=[];

chats[currentChat].push({text,type:"user"});
chats[currentChat].push({text:"We'll reply soon!",type:"business"});

msgInput.value="";
openChat(currentChat);
}

// INIT
renderJobs(jobs);
showOnMap(12.93,100.88);

</script>

</body>
</html>
