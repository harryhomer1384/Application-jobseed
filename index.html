<script>

/* =========================
HIGH QUALITY IMAGE FIX
========================= */
jobs.forEach((j,i)=>{
    j.img = `https://source.unsplash.com/800x500/?work,job,office,${i}`;
});

/* =========================
STAR SYSTEM (NO EMOJIS)
========================= */
function renderStars(rating){
    let full = Math.floor(rating);
    let empty = 5 - full;
    return `
    <span class="stars">
        ${"★".repeat(full)}${"☆".repeat(empty)}
    </span>`;
}

/* =========================
UPDATE JOB RENDER (EXTEND)
========================= */
const oldRenderJobs = renderJobs;

renderJobs = function(list){
    jobList.innerHTML = list.map(j=>`
    <div class="card">
        <img src="${j.img}">
        
        <b>${j.title}</b><br>
        ${j.company}<br>
        
        ${renderStars(j.rating)} (${j.reviews})<br>
        
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">
        
        <button class="btn" onclick='applyJob(${JSON.stringify(j)})'>
        <i data-lucide="send"></i> Apply
        </button>

        <button class="btn" onclick='saveJob(${JSON.stringify(j)})'>
        <i data-lucide="heart"></i>
        </button>

        <button class="btn" onclick="viewLocation(${j.lat},${j.lng})">
        <i data-lucide="map-pin"></i>
        </button>

        </div>

        <div id="reviews-${j.company}"></div>

    </div>
    `).join("");

    lucide.createIcons();
};

/* =========================
LOCATION SYSTEM
========================= */
function viewLocation(lat,lng){
    mapContainer.innerHTML = `
    <iframe width="100%" height="400"
    src="https://www.google.com/maps?q=${lat},${lng}&output=embed">
    </iframe>`;
}

/* =========================
SAVE JOB SYSTEM
========================= */
let savedJobs = JSON.parse(localStorage.getItem("savedJobs")) || [];

function saveJob(job){
    savedJobs.push(job);
    localStorage.setItem("savedJobs", JSON.stringify(savedJobs));
}

/* =========================
ADVANCED FILTERS
========================= */
function filterAdvanced(){
    let minRating = document.getElementById("filterRating")?.value || 0;
    let filtered = jobs.filter(j => j.rating >= minRating);
    renderJobs(filtered);
}

/* =========================
SORT SYSTEM
========================= */
function sortBy(type){
    let sorted = [...jobs];

    if(type==="rating"){
        sorted.sort((a,b)=>b.rating-a.rating);
    }

    if(type==="pay"){
        sorted.sort((a,b)=>parseInt(b.pay?.slice(1)||0)-parseInt(a.pay?.slice(1)||0));
    }

    renderJobs(sorted);
}

/* =========================
REVIEWS SYSTEM (DISPLAY)
========================= */
function renderReviews(){
    db.reviews.forEach(r=>{
        let el = document.getElementById("reviews-"+r.company);
        if(el){
            el.innerHTML += `
            <div class="review">
                ${r.text}
            </div>`;
        }
    });
}

/* =========================
ENHANCED APPLICATION VALIDATION
========================= */
const oldSubmit = submitApplication;

submitApplication = function(){

    let name = document.getElementById("nameInput")?.value;
    let reason = document.getElementById("reasonInput")?.value;

    if(!name || !reason){
        alert("Fill all fields");
        return;
    }

    oldSubmit();
};

/* =========================
CHAT TIMESTAMPS
========================= */
const oldSend = sendMsg;

sendMsg = function(){
    let text = msgInput.value;
    if(!text) return;

    let time = new Date().toLocaleTimeString();

    if(!db.chats[currentChat]) db.chats[currentChat] = [];

    db.chats[currentChat].push({
        text: text + " (" + time + ")",
        type:"user"
    });

    db.chats[currentChat].push({
        text:"Reply soon ("+time+")",
        type:"business"
    });

    saveDB();
    openChat(currentChat);
    msgInput.value="";
};

/* =========================
DASHBOARD EXPANSION
========================= */
function updateDashboard(){
    updateStats();

    let totalSaved = savedJobs.length;

    let dash = document.querySelector(".dashboard");
    dash.innerHTML += `
    <div class="stat">Saved Jobs: ${totalSaved}</div>
    `;
}

/* =========================
INIT EXTENSIONS
========================= */
renderJobs(jobs);
renderReviews();
updateDashboard();

</script>
