<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobSeed Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

/* ========================= GLOBAL ========================= */
body{
margin:0;
font-family:'Inter',sans-serif;
background:linear-gradient(135deg,#f0fdf4,#dcfce7,#ecfdf5);
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

/* ========================= NAVBAR ========================= */
.navbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 25px;
background:white;
box-shadow:0 5px 20px rgba(0,0,0,0.05);
position:sticky;
top:0;
z-index:1000;
}

.btn{
padding:10px 14px;
border:none;
border-radius:10px;
background:#16a34a;
color:white;
cursor:pointer;
font-weight:600;
margin-right:5px;
}

.btn.secondary{
background:#e5e7eb;
color:#111;
}

/* ========================= LAYOUT ========================= */
.layout{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

/* ========================= CARD ========================= */
.card{
background:white;
padding:16px;
border-radius:16px;
margin-bottom:14px;
box-shadow:0 12px 30px rgba(0,0,0,0.08);
transition:0.25s;
}

.card:hover{
transform:translateY(-5px);
}

.card img{
width:100%;
height:160px;
object-fit:cover;
border-radius:10px;
}

/* ========================= STARS ========================= */
.stars{
color:#facc15;
}

/* ========================= MAP ========================= */
.map-box{
background:white;
padding:12px;
border-radius:12px;
margin-top:10px;
}

/* ========================= GRID ========================= */
.apps-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.app-card{
background:white;
padding:12px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,0.05);
}

/* ========================= CHAT ========================= */
.popup{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.4);
justify-content:center;
align-items:center;
z-index:2000;
}

.chat-box{
background:white;
width:90%;
max-width:700px;
border-radius:12px;
overflow:hidden;
}

.chat-header{
display:flex;
justify-content:space-between;
padding:12px;
border-bottom:1px solid #eee;
}

.chat-messages{
height:300px;
overflow-y:auto;
padding:10px;
}

.msg{
padding:8px;
border-radius:10px;
margin:5px 0;
max-width:70%;
}

.user{
background:#16a34a;
color:white;
margin-left:auto;
}

.business{
background:#eee;
}

.chat-input{
display:flex;
border-top:1px solid #eee;
}

.chat-input input{
flex:1;
padding:10px;
border:none;
}

/* ========================= MOBILE ========================= */
@media(max-width:768px){
.layout{grid-template-columns:1fr;}
.apps-grid{grid-template-columns:1fr;}
}

</style>
</head>

<body>

<div class="navbar">
<b>JobSeed</b>
<div>
<button class="btn" onclick="toggleApps()">Applications</button>
<button class="btn" onclick="toggleChat()">Chat</button>
</div>
</div>

<div class="container">

<input placeholder="Search jobs..." onkeyup="searchJobs(this.value)">
<button class="btn" onclick="sortJobs('pay')">Highest Pay</button>
<button class="btn" onclick="sortJobs('rating')">Top Rated</button>
<button class="btn secondary" onclick="toggleMapView()">Toggle Map</button>

<div class="layout">

<div id="jobList"></div>

<div>
<div id="mapContainer">Map hidden</div>
</div>

</div>

</div>

<!-- APPLICATIONS -->
<div id="appsPopup" class="popup">
<div class="chat-box">
<div class="chat-header">
<b>Applications</b>
<button onclick="toggleApps()">Close</button>
</div>
<div id="appList" style="padding:10px;"></div>
</div>
</div>

<!-- CHAT -->
<div id="chatPopup" class="popup">
<div class="chat-box">

<div class="chat-header">
<b>Messages</b>
<button onclick="toggleChat()">Close</button>
</div>

<div id="chatMessages" class="chat-messages"></div>

<div class="chat-input">
<input id="msgInput">
<button class="btn" onclick="sendMsg()">Send</button>
</div>

</div>
</div>

<script>

/* ========================= DATA ========================= */
const jobs = [
{title:"Barista",company:"Cafe Amazon",lat:12.682,lng:101.281,pay:500,rating:4.5,img:"https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb"},
{title:"Retail",company:"Central Mall",lat:12.680,lng:101.279,pay:550,rating:4.2,img:"https://images.unsplash.com/photo-1512436991641"},
{title:"Hotel Staff",company:"Hilton",lat:12.678,lng:101.282,pay:700,rating:4.8,img:"https://images.unsplash.com/photo-1566073771259"},
{title:"Waiter",company:"Beach Restaurant",lat:12.676,lng:101.285,pay:600,rating:4.3,img:"https://images.unsplash.com/photo-1559339352"}
];

let applications=[];
let savedJobs=[];
let chats={};
let currentChat="General";

let selectedLocation=null;
let mapVisible=false;

/* ========================= FUNCTIONS ========================= */

function stars(r){
return "★".repeat(Math.floor(r))+"☆".repeat(5-Math.floor(r));
}

function renderJobs(list){
jobList.innerHTML=list.map(j=>`
<div class="card">
<img src="${j.img}">
<b>${j.title}</b><br>
${j.company}<br>
฿${j.pay}<br>
<div class="stars">${stars(j.rating)}</div>

<button class="btn" onclick='applyJob(${JSON.stringify(j)})'>Apply</button>
<button class="btn" onclick="selectLocation(${j.lat},${j.lng},'${j.company}','${j.title}')">Location</button>
<button class="btn secondary" onclick='saveJob(${JSON.stringify(j)})'>Save</button>

</div>
`).join("");
}

function applyJob(job){
applications.push(job);
renderApps();
}

function saveJob(job){
savedJobs.push(job);
}

/* ========================= MAP ========================= */
function selectLocation(lat,lng,company,title){
selectedLocation={lat,lng,company,title};
renderMap();
}

function toggleMapView(){
mapVisible=!mapVisible;
renderMap();
}

function renderMap(){
if(!mapVisible || !selectedLocation){
mapContainer.innerHTML="Map hidden";
return;
}

mapContainer.innerHTML=`
<iframe width="100%" height="300"
src="https://www.google.com/maps?q=${selectedLocation.lat},${selectedLocation.lng}&output=embed"></iframe>

<div class="map-box">
<b>${selectedLocation.company}</b><br>
${selectedLocation.title}<br>
<button class="btn" onclick="openMaps(${selectedLocation.lat},${selectedLocation.lng})">Open in Maps</button>
</div>
`;
}

function openMaps(lat,lng){
window.open(`https://www.google.com/maps?q=${lat},${lng}`);
}

/* ========================= SORT ========================= */
function sortJobs(type){
let sorted=[...jobs];

if(type==="pay") sorted.sort((a,b)=>b.pay-a.pay);
if(type==="rating") sorted.sort((a,b)=>b.rating-a.rating);

renderJobs(sorted);
}

/* ========================= APPS ========================= */
function renderApps(){
appList.innerHTML=`
<div class="apps-grid">
${applications.map(a=>`
<div class="app-card">
<b>${a.title}</b><br>${a.company}
</div>
`).join("")}
</div>
`;
}

function toggleApps(){
appsPopup.style.display=appsPopup.style.display==="flex"?"none":"flex";
renderApps();
}

/* ========================= CHAT ========================= */
function toggleChat(){
chatPopup.style.display=chatPopup.style.display==="flex"?"none":"flex";
renderChat();
}

function sendMsg(){
let text=msgInput.value;
if(!text)return;

if(!chats[currentChat]) chats[currentChat]=[];

chats[currentChat].push({text,type:"user"});
chats[currentChat].push({text:"Reply soon",type:"business"});

msgInput.value="";
renderChat();
}

function renderChat(){
chatMessages.innerHTML=(chats[currentChat]||[]).map(m=>`
<div class="msg ${m.type}">${m.text}</div>
`).join("");

chatMessages.scrollTop=chatMessages.scrollHeight;
}

/* ========================= SEARCH ========================= */
function searchJobs(q){
renderJobs(jobs.filter(j=>j.title.toLowerCase().includes(q.toLowerCase())));
}

/* INIT */
renderJobs(jobs);

</script>

</body>
</html>
