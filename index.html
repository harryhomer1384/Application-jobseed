<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobSeed</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body { font-family: 'Inter', sans-serif; margin:0; background:#f0fdf4; }

.navbar {
    background:white; padding:15px;
    display:flex; justify-content:space-between;
}
.navbar button {
    margin-left:8px;
}

/* LAYOUT */
.container { max-width:1200px; margin:20px auto; padding:15px; }

.layout { display:flex; gap:15px; }

#jobList { width:50%; max-height:500px; overflow-y:auto; }
#mapContainer { width:50%; }

.card {
    background:white; padding:12px;
    border-radius:12px; margin-bottom:10px;
    cursor:pointer;
}

.card img {
    width:100%; height:140px;
    object-fit:cover; border-radius:10px;
}

button {
    padding:8px; border:none;
    border-radius:8px;
    background:#16a34a; color:white;
    cursor:pointer;
}

/* POPUPS */
.popup {
    display:none;
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:rgba(0,0,0,0.4);
    justify-content:center;
    align-items:center;
}

.popup-box {
    background:white;
    padding:20px;
    border-radius:12px;
    width:90%;
    max-width:700px;
}

/* CHAT */
.chat-style { display:flex; height:400px; }
.chat-sidebar { width:30%; border-right:1px solid #eee; overflow-y:auto; }
.chat-main { width:70%; display:flex; flex-direction:column; }
.chat-messages { flex:1; padding:10px; overflow-y:auto; }

.msg {
    padding:8px;
    border-radius:10px;
    margin:5px 0;
    max-width:70%;
}
.user { background:#16a34a; color:white; margin-left:auto; }
.business { background:#eee; }

.chat-input { display:flex; }
.chat-input input { flex:1; padding:10px; border:none; }

/* APPLICATION */
.app-card {
    background:#f9fafb;
    padding:10px;
    border-radius:10px;
    margin-bottom:10px;
}

.status { font-size:12px; padding:4px 6px; border-radius:6px; }
.pending { background:orange; color:white; }
.accepted { background:green; color:white; }
.rejected { background:red; color:white; }

@media(max-width:768px){
    .layout { flex-direction:column; }
    #jobList, #mapContainer { width:100%; }
}
</style>
</head>

<body>

<div class="navbar">
    <b>🌱 JobSeed</b>
    <div>
        <button onclick="toggleApps()">📄 Applications</button>
        <button onclick="toggleChat()">💬 Chat</button>
    </div>
</div>

<div class="container">
<h2>Jobs</h2>

<input placeholder="Search..." onkeyup="searchJobs(this.value)">
<button onclick="findNearbyJobs()">📍 Nearby</button>

<div class="layout">
    <div id="jobList"></div>
    <div id="mapContainer"></div>
</div>
</div>

<!-- APPLICATION POPUP -->
<div id="appsPopup" class="popup">
<div class="popup-box">
<h3>Applications</h3>
<div id="appList"></div>
<button onclick="toggleApps()">Close</button>
</div>
</div>

<!-- CHAT POPUP -->
<div id="chatPopup" class="popup">
<div class="popup-box chat-style">

<div id="chatUsers" class="chat-sidebar"></div>

<div class="chat-main">
<div id="chatMessages" class="chat-messages"></div>

<div class="chat-input">
<input id="msgInput" placeholder="Message">
<button onclick="sendMsg()">Send</button>
</div>
</div>

<button onclick="toggleChat()">Close</button>
</div>
</div>

<script>

// 10 JOBS
const jobs=[
{title:"Barista",company:"Cafe Amazon",pay:"฿500",rating:4.5,reviews:32,lat:12.93,lng:100.88,img:"https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb"},
{title:"Retail",company:"Central Mall",pay:"฿550",rating:4.2,reviews:20,lat:12.92,lng:100.87,img:"https://images.unsplash.com/photo-1512436991641-6745cdb1723f"},
{title:"Hotel Staff",company:"Hilton",pay:"฿700",rating:4.8,reviews:55,lat:12.94,lng:100.88,img:"https://images.unsplash.com/photo-1566073771259"},
{title:"Waiter",company:"Beach Restaurant",pay:"฿600",rating:4.3,reviews:18,lat:12.91,lng:100.87,img:"https://images.unsplash.com/photo-1559339352"},
{title:"Cleaner",company:"Mall",pay:"฿500",rating:4.0,reviews:10,lat:12.90,lng:100.86,img:"https://images.unsplash.com/photo-1581578731548"},
{title:"Delivery Rider",company:"Foodpanda",pay:"฿800",rating:4.6,reviews:40,lat:12.91,lng:100.89,img:"https://images.unsplash.com/photo-1607082349566"},
{title:"Dog Walker",company:"Happy Paws",pay:"฿400",rating:4.1,reviews:12,lat:12.89,lng:100.90,img:"https://images.unsplash.com/photo-1558944351"},
{title:"Spa Assistant",company:"Jomtien Spa",pay:"฿650",rating:4.7,reviews:25,lat:12.88,lng:100.88,img:"https://images.unsplash.com/photo-1544161515"},
{title:"Cashier",company:"7-11",pay:"฿520",rating:4.2,reviews:30,lat:12.92,lng:100.89,img:"https://images.unsplash.com/photo-1607082349566"},
{title:"Kitchen Helper",company:"Seafood Kitchen",pay:"฿550",rating:4.4,reviews:22,lat:12.93,lng:100.87,img:"https://images.unsplash.com/photo-1504674900247"}
];

let applications=JSON.parse(localStorage.getItem("apps"))||[];
let chats=JSON.parse(localStorage.getItem("chats"))||{};
let currentChat=null;

// JOBS
function renderJobs(list){
let html="";
list.forEach(j=>{
html+=`
<div class="card" onclick="showOnMap(${j.lat},${j.lng})">
<img src="${j.img}">
<b>${j.title}</b><br>
${j.company}<br>
${j.pay}<br>
⭐ ${j.rating} (${j.reviews})<br>
<button onclick='applyJob(${JSON.stringify(j)})'>Apply</button>
</div>`;
});
jobList.innerHTML=html;
}

// MAP
function showOnMap(lat,lng){
mapContainer.innerHTML=`
<iframe width="100%" height="500"
src="https://www.google.com/maps?q=${lat},${lng}&output=embed"></iframe>`;
}

// SEARCH
function searchJobs(q){
renderJobs(jobs.filter(j=>j.title.toLowerCase().includes(q.toLowerCase())));
}

// APPLY
function applyJob(job){
applications.push({...job,status:"pending"});
localStorage.setItem("apps",JSON.stringify(applications));
renderApps();
renderUsers();
}

// APPLICATIONS
function renderApps(){
let html="";
applications.forEach(a=>{
html+=`
<div class="app-card">
<b>${a.title}</b><br>${a.company}<br>
<span class="status ${a.status}">${a.status}</span>
</div>`;
});
appList.innerHTML=html;
}

// CHAT
function renderUsers(){
let html="";
applications.forEach(a=>{
html+=`<div onclick="openChat('${a.company}')">${a.company}</div>`;
});
chatUsers.innerHTML=html;
}

function openChat(name){
currentChat=name;
chatMessages.innerHTML="";
(chats[name]||[]).forEach(m=>{
chatMessages.innerHTML+=`<div class="msg ${m.type}">${m.text}</div>`;
});
}

function sendMsg(){
let text=msgInput.value;
if(!text||!currentChat)return;

if(!chats[currentChat])chats[currentChat]=[];

chats[currentChat].push({text,type:"user"});
chats[currentChat].push({text:"We'll reply soon!",type:"business"});

localStorage.setItem("chats",JSON.stringify(chats));

msgInput.value="";
openChat(currentChat);
}

// POPUPS
function toggleApps(){
appsPopup.style.display = appsPopup.style.display==="flex"?"none":"flex";
renderApps();
}
function toggleChat(){
chatPopup.style.display = chatPopup.style.display==="flex"?"none":"flex";
renderUsers();
}

// DISTANCE
function getDistance(lat1, lon1, lat2, lon2){
const R=6371;
const dLat=(lat2-lat1)*Math.PI/180;
const dLon=(lon2-lon1)*Math.PI/180;
const a=Math.sin(dLat/2)**2 +
Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
Math.sin(dLon/2)**2;
return R*(2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)));
}

// NEARBY
function findNearbyJobs(){
navigator.geolocation.getCurrentPosition(pos=>{
const userLat=pos.coords.latitude;
const userLng=pos.coords.longitude;

let list=jobs.map(j=>{
const d=getDistance(userLat,userLng,j.lat,j.lng);
return {...j,distance:d};
});

list.sort((a,b)=>a.distance-b.distance);
renderJobs(list);
showOnMap(userLat,userLng);
});
}

// INIT
renderJobs(jobs);
showOnMap(12.93,100.88);

</script>

</body>
</html>
