<!-- JOBSEED PROFESSIONAL DASHBOARD (FINAL FULL VERSION) -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobSeed Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

/* =========================
GLOBAL
========================= */
body{
margin:0;
font-family:'Inter',sans-serif;
background:#f5f7fa;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

/* =========================
NAVBAR
========================= */
.navbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 25px;
background:white;
box-shadow:0 4px 15px rgba(0,0,0,0.05);
position:sticky;
top:0;
z-index:1000;
}

.nav-title{
font-weight:700;
}

/* =========================
BUTTONS
========================= */
.btn{
padding:10px 14px;
border:none;
border-radius:10px;
background:#16a34a;
color:white;
cursor:pointer;
font-weight:600;
}

.btn-secondary{
background:#e5e7eb;
color:#111;
}

/* =========================
LAYOUT
========================= */
.layout{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

/* =========================
JOB CARD
========================= */
.card{
background:white;
padding:14px;
border-radius:14px;
box-shadow:0 8px 20px rgba(0,0,0,0.06);
margin-bottom:12px;
}

.card img{
width:100%;
height:160px;
object-fit:cover;
border-radius:10px;
}

/* =========================
STARS
========================= */
.stars{
color:#facc15;
letter-spacing:2px;
}

/* =========================
MAP PANEL
========================= */
.map-box{
margin-top:10px;
background:white;
padding:12px;
border-radius:12px;
}

/* =========================
APPLICATION GRID
========================= */
.apps-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.app-card{
background:white;
padding:10px;
border-radius:10px;
box-shadow:0 5px 12px rgba(0,0,0,0.05);
}

/* =========================
CHAT
========================= */
.popup{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.4);
justify-content:center;
align-items:center;
z-index:2000;
}

.chat-box{
background:white;
width:90%;
max-width:700px;
border-radius:12px;
overflow:hidden;
}

.chat-header{
display:flex;
justify-content:space-between;
padding:12px;
border-bottom:1px solid #eee;
}

.chat-messages{
height:300px;
overflow-y:auto;
padding:10px;
}

.msg{
padding:8px;
border-radius:10px;
margin:5px 0;
max-width:70%;
}

.user{
background:#16a34a;
color:white;
margin-left:auto;
}

.business{
background:#eee;
}

.chat-input{
display:flex;
border-top:1px solid #eee;
}

.chat-input input{
flex:1;
padding:10px;
border:none;
}

/* =========================
MOBILE
========================= */
@media(max-width:768px){
.layout{
grid-template-columns:1fr;
}
.apps-grid{
grid-template-columns:1fr;
}
}

</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
<div class="nav-title">JobSeed</div>

<div>
<button class="btn" onclick="toggleApps()">Applications</button>
<button class="btn" onclick="toggleChat()">Chat</button>
</div>
</div>

<div class="container">

<!-- SEARCH -->
<input placeholder="Search jobs..." onkeyup="searchJobs(this.value)">
<button class="btn" onclick="findNearby()">Nearby</button>

<div class="layout">

<!-- LEFT: JOB LIST -->
<div id="jobList"></div>

<!-- RIGHT: MAP -->
<div id="mapContainer"></div>

</div>

</div>

<!-- APPLICATIONS -->
<div id="appsPopup" class="popup">
<div class="chat-box">
<div class="chat-header">
<b>Applications</b>
<button onclick="toggleApps()">Close</button>
</div>
<div id="appList" style="padding:10px;"></div>
</div>
</div>

<!-- CHAT -->
<div id="chatPopup" class="popup">
<div class="chat-box">

<div class="chat-header">
<b>Messages</b>
<button onclick="toggleChat()">Close</button>
</div>

<div id="chatMessages" class="chat-messages"></div>

<div class="chat-input">
<input id="msgInput">
<button class="btn" onclick="sendMsg()">Send</button>
</div>

</div>
</div>

<script>

/* =========================
REAL LOCATION DATA (NO OCEAN)
========================= */
const jobs = [
{title:"Barista",company:"Cafe Amazon",lat:12.682,lng:101.281,pay:500,rating:4.5,img:"https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb"},
{title:"Retail",company:"Central Mall",lat:12.680,lng:101.279,pay:550,rating:4.2,img:"https://images.unsplash.com/photo-1512436991641"},
{title:"Hotel Staff",company:"Hilton",lat:12.678,lng:101.282,pay:700,rating:4.8,img:"https://images.unsplash.com/photo-1566073771259"},
{title:"Waiter",company:"Beach Restaurant",lat:12.676,lng:101.285,pay:600,rating:4.3,img:"https://images.unsplash.com/photo-1559339352"}
];

let applications=[];
let chats={};
let currentChat=null;
let mapOpen=false;

/* =========================
STARS
========================= */
function stars(r){
return "★".repeat(Math.floor(r))+"☆".repeat(5-Math.floor(r));
}

/* =========================
RENDER JOBS
========================= */
function renderJobs(list){
jobList.innerHTML=list.map(j=>`
<div class="card">
<img src="${j.img}">
<b>${j.title}</b><br>
${j.company}<br>
฿${j.pay}<br>
<div class="stars">${stars(j.rating)}</div>

<button class="btn" onclick='applyJob(${JSON.stringify(j)})'>Apply</button>
<button class="btn" onclick="viewLocation(${j.lat},${j.lng},'${j.company}','${j.title}')">Location</button>

</div>
`).join("");
}

/* =========================
MAP (FIXED)
========================= */
function viewLocation(lat,lng,company,title){

if(mapOpen){
mapContainer.innerHTML="";
mapOpen=false;
return;
}

mapContainer.innerHTML=`
<iframe width="100%" height="300"
src="https://www.google.com/maps?q=${lat},${lng}&output=embed"></iframe>

<div class="map-box">
<b>${company}</b><br>
${title}<br>
<button class="btn" onclick="openMaps(${lat},${lng})">Open in Maps</button>
</div>
`;

mapOpen=true;
}

function openMaps(lat,lng){
window.open(`https://www.google.com/maps?q=${lat},${lng}`);
}

/* =========================
APPLICATIONS
========================= */
function applyJob(job){
applications.push(job);
renderApps();
}

function renderApps(){
appList.innerHTML=`
<div class="apps-grid">
${applications.map(a=>`
<div class="app-card">
<b>${a.title}</b><br>
${a.company}
</div>
`).join("")}
</div>
`;
}

function toggleApps(){
appsPopup.style.display=appsPopup.style.display==="flex"?"none":"flex";
}

/* =========================
CHAT
========================= */
function toggleChat(){
chatPopup.style.display=chatPopup.style.display==="flex"?"none":"flex";
}

function sendMsg(){
let text=msgInput.value;
if(!text)return;

if(!chats[currentChat])chats[currentChat]=[];

chats[currentChat].push({text,type:"user"});
chats[currentChat].push({text:"Reply soon",type:"business"});

msgInput.value="";
renderChat();
}

function renderChat(){
chatMessages.innerHTML=(chats[currentChat]||[]).map(m=>`
<div class="msg ${m.type}">${m.text}</div>
`).join("");
}

/* =========================
SEARCH
========================= */
function searchJobs(q){
renderJobs(jobs.filter(j=>j.title.toLowerCase().includes(q.toLowerCase())));
}

/* =========================
LOCATION
========================= */
function findNearby(){
navigator.geolocation.getCurrentPosition(pos=>{
viewLocation(pos.coords.latitude,pos.coords.longitude,"Your Location","You are here");
});
}

/* INIT */
renderJobs(jobs);

</script>

</body>
</html>
