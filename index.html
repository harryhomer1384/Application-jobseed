<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobSeed Ultimate</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body {
    margin:0;
    font-family:'Inter',sans-serif;
    background:linear-gradient(135deg,#ecfdf5,#dcfce7);
}

/* NAV */
.navbar {
    position:sticky;
    top:0;
    background:white;
    padding:15px 25px;
    display:flex;
    justify-content:space-between;
    box-shadow:0 5px 15px rgba(0,0,0,0.05);
    z-index:1000;
}

/* HERO */
.hero {
    text-align:center;
    padding:60px 20px;
}
.hero h1 { font-size:40px; }
.hero span { color:#16a34a; }

/* LAYOUT */
.container { max-width:1200px; margin:auto; padding:20px; }
.layout { display:flex; gap:20px; }
#jobList { width:50%; }
#mapContainer { width:50%; }

/* CARD */
.card {
    background:rgba(255,255,255,0.9);
    padding:12px;
    border-radius:16px;
    margin-bottom:12px;
    cursor:pointer;
    backdrop-filter:blur(10px);
    box-shadow:0 10px 25px rgba(0,0,0,0.08);
    transition:0.3s;
}
.card:hover { transform:translateY(-6px) scale(1.02); }
.card img {
    width:100%;
    height:140px;
    object-fit:cover;
    border-radius:10px;
}

/* BUTTON */
button {
    padding:8px 12px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#16a34a,#22c55e);
    color:white;
    cursor:pointer;
}
button:hover { transform:scale(1.05); }

/* POPUP */
.popup {
    display:none;
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    background:rgba(0,0,0,0.4);
    justify-content:center;
    align-items:center;
}
.popup-box {
    background:white;
    padding:20px;
    border-radius:16px;
    width:90%;
    max-width:700px;
}

/* CHAT */
.chat-style { display:flex; height:400px; }
.chat-sidebar { width:30%; border-right:1px solid #eee; overflow-y:auto; }
.chat-main { width:70%; display:flex; flex-direction:column; }
.chat-messages { flex:1; padding:10px; overflow-y:auto; }
.msg { padding:8px; border-radius:10px; margin:5px 0; max-width:70%; }
.user { background:#16a34a; color:white; margin-left:auto; }
.business { background:#eee; }

/* FLOAT CHAT */
.chat-btn {
    position:fixed;
    bottom:80px;
    right:20px;
    background:#16a34a;
    color:white;
    padding:14px;
    border-radius:50%;
}

/* BOTTOM NAV */
.bottom-nav {
    position:fixed;
    bottom:0;
    width:100%;
    display:flex;
    justify-content:space-around;
    background:white;
    padding:10px;
}

/* APPLICATION CARD */
.app-card {
    background:#f9fafb;
    padding:10px;
    border-radius:10px;
    margin-bottom:10px;
}
</style>
</head>

<body>

<div class="navbar">
<b>🌱 JobSeed Ultimate</b>
<div>
<button onclick="signup()">Sign Up</button>
<button onclick="login()">Login</button>
<button onclick="toggleApps()">📄</button>
<button onclick="toggleChat()">💬</button>
</div>
</div>

<div class="hero">
<h1>Find Jobs <span>Nearby</span></h1>
<p>Real jobs • Real chat • Real backend simulation</p>
</div>

<div class="container">

<input placeholder="Search..." onkeyup="searchJobs(this.value)">
<button onclick="findNearbyJobs()">📍 Nearby</button>

<div class="layout">
<div id="jobList"></div>
<div id="mapContainer"></div>
</div>

</div>

<!-- APPLICATION POPUP -->
<div id="appsPopup" class="popup">
<div class="popup-box">
<h3>Your Applications</h3>
<div id="appList"></div>
<button onclick="toggleApps()">Close</button>
</div>
</div>

<!-- APPLY FORM -->
<div id="applyPopup" class="popup">
<div class="popup-box">
<h3>Apply</h3>
<input placeholder="Your Name">
<input placeholder="Why should we hire you?">
<input placeholder="Available hours">
<button onclick="submitApplication()">Submit</button>
<button onclick="closeApply()">Cancel</button>
</div>
</div>

<!-- CHAT -->
<div id="chatPopup" class="popup">
<div class="popup-box chat-style">
<div id="chatUsers" class="chat-sidebar"></div>
<div class="chat-main">
<div id="chatMessages" class="chat-messages"></div>
<div>
<input id="msgInput">
<button onclick="sendMsg()">Send</button>
</div>
</div>
<button onclick="toggleChat()">Close</button>
</div>
</div>

<div class="chat-btn" onclick="toggleChat()">💬</div>

<div class="bottom-nav">
<button onclick="toggleApps()">📄</button>
<button onclick="window.scrollTo(0,0)">🏠</button>
<button onclick="findNearbyJobs()">📍</button>
</div>

<script>

// ===== FAKE DATABASE =====
let db = JSON.parse(localStorage.getItem("db")) || {
    users: [],
    currentUser: null,
    applications: [],
    chats: {}
};

function saveDB(){
    localStorage.setItem("db", JSON.stringify(db));
}

// ===== AUTH =====
function signup(){
    const name = prompt("Username");
    if(!name) return;
    db.users.push({name});
    db.currentUser = name;
    saveDB();
    alert("Signed up!");
}

function login(){
    const name = prompt("Username");
    if(db.users.find(u=>u.name===name)){
        db.currentUser = name;
        saveDB();
        alert("Logged in!");
    } else alert("User not found");
}

// ===== JOBS =====
const jobs = Array.from({length:10},(_,i)=>({
title:["Barista","Retail","Hotel Staff","Waiter","Cleaner","Delivery","Dog Walker","Spa","Cashier","Kitchen"][i],
company:"Company "+(i+1),
pay:"฿"+(400+i*50),
rating:4+Math.random(),
reviews:Math.floor(Math.random()*50),
lat:12.9+Math.random()/10,
lng:100.8+Math.random()/10,
img:"https://picsum.photos/300?"+i
}));

let selectedJob=null;
let currentChat=null;

// ===== RENDER JOBS =====
function renderJobs(list){
jobList.innerHTML=list.map(j=>`
<div class="card" onclick="showOnMap(${j.lat},${j.lng})">
<img src="${j.img}">
<b>${j.title}</b><br>
${j.company}<br>
${j.pay}<br>
⭐ ${"★".repeat(Math.round(j.rating))} (${j.reviews})<br>
<button onclick='applyJob(${JSON.stringify(j)})'>Apply</button>
</div>`).join("");
}

// ===== MAP =====
function showOnMap(lat,lng){
mapContainer.innerHTML=`<iframe width="100%" height="400" src="https://www.google.com/maps?q=${lat},${lng}&output=embed"></iframe>`;
}

// ===== SEARCH =====
function searchJobs(q){
renderJobs(jobs.filter(j=>j.title.toLowerCase().includes(q.toLowerCase())));
}

// ===== APPLY =====
function applyJob(job){
selectedJob=job;
applyPopup.style.display="flex";
}

function closeApply(){ applyPopup.style.display="none"; }

function submitApplication(){
if(!selectedJob || !db.currentUser){ alert("Login first"); return; }

db.applications.push({
user: db.currentUser,
job: selectedJob,
status:"pending"
});

saveDB();
closeApply();
renderApps();
simulateDecision(selectedJob.company);
}

// ===== AI DECISION =====
function simulateDecision(company){
setTimeout(()=>{
db.applications.forEach(a=>{
if(a.job.company===company && a.status==="pending"){
a.status=Math.random()>0.5?"accepted":"rejected";
}
});
saveDB();
renderApps();
},3000);
}

// ===== APPS =====
function renderApps(){
const myApps=db.applications.filter(a=>a.user===db.currentUser);
appList.innerHTML=myApps.map(a=>`
<div class="app-card">
<b>${a.job.title}</b><br>
${a.job.company}<br>
Status: ${a.status}
</div>`).join("");
}

// ===== CHAT =====
function renderUsers(){
chatUsers.innerHTML=db.applications.map(a=>`
<div onclick="openChat('${a.job.company}')">${a.job.company}</div>
`).join("");
}

function openChat(name){
currentChat=name;
const key=db.currentUser+"_"+name;
chatMessages.innerHTML=(db.chats[key]||[]).map(m=>`
<div class="msg ${m.type}">${m.text}</div>
`).join("");
}

function sendMsg(){
let text=msgInput.value;
if(!text||!currentChat||!db.currentUser)return;

const key=db.currentUser+"_"+currentChat;
if(!db.chats[key]) db.chats[key]=[];

db.chats[key].push({text,type:"user"});
db.chats[key].push({text:"We’ll reply soon!",type:"business"});

saveDB();
msgInput.value="";
openChat(currentChat);
}

// ===== POPUPS =====
function toggleApps(){
appsPopup.style.display=appsPopup.style.display==="flex"?"none":"flex";
renderApps();
}
function toggleChat(){
chatPopup.style.display=chatPopup.style.display==="flex"?"none":"flex";
renderUsers();
}

// ===== LOCATION =====
function findNearbyJobs(){
navigator.geolocation.getCurrentPosition(pos=>{
renderJobs(jobs);
showOnMap(pos.coords.latitude,pos.coords.longitude);
});
}

// INIT
renderJobs(jobs);
showOnMap(12.93,100.88);

</script>

</body>
</html>
