<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobSeed</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Inter',sans-serif;
background:linear-gradient(135deg,#ecfdf5,#dcfce7);
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.navbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 25px;
background:white;
box-shadow:0 5px 20px rgba(0,0,0,0.05);
position:sticky;
top:0;
}

.btn{
padding:10px 16px;
border:none;
border-radius:12px;
background:linear-gradient(135deg,#16a34a,#22c55e);
color:white;
cursor:pointer;
font-weight:600;
}

.hero{
text-align:center;
padding:50px;
}

.layout{
display:flex;
gap:20px;
}

#jobList{width:50%;}
#mapContainer{width:50%;}

.card{
background:white;
border-radius:18px;
padding:14px;
margin-bottom:12px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.card img{
width:100%;
height:160px;
object-fit:cover;
border-radius:10px;
}

.stars{
color:#facc15;
letter-spacing:2px;
}

.popup{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.4);
justify-content:center;
align-items:center;
z-index:2000;
}

.popup-box{
background:white;
border-radius:16px;
width:90%;
max-width:700px;
}

/* CHAT UI */
.msg{
padding:10px 12px;
border-radius:12px;
margin:6px 0;
max-width:70%;
font-size:14px;
}

.user{
background:#16a34a;
color:white;
margin-left:auto;
}

.business{
background:white;
border:1px solid #eee;
}

/* APPLICATION GRID */
.apps-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.app-card{
background:#f9fafb;
padding:12px;
border-radius:12px;
}

@media(max-width:768px){
.layout{flex-direction:column;}
#jobList,#mapContainer{width:100%;}
.apps-grid{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<div class="navbar">
<b>JobSeed</b>
<div>
<button class="btn" onclick="toggleApps()">Applications</button>
<button class="btn" onclick="toggleChat()">Chat</button>
</div>
</div>

<div class="hero">
<h1>Find Jobs Nearby</h1>
</div>

<div class="container">

<input placeholder="Search..." onkeyup="searchJobs(this.value)">
<button class="btn" onclick="findNearbyJobs()">Nearby</button>

<div class="layout">
<div id="jobList"></div>
<div id="mapContainer"></div>
</div>

</div>

<!-- APPLICATIONS -->
<div id="appsPopup" class="popup">
<div class="popup-box" style="padding:20px;">
<h3>Applications</h3>
<div id="appList"></div>
<button class="btn" onclick="toggleApps()">Close</button>
</div>
</div>

<!-- CHAT -->
<div id="chatPopup" class="popup">

<div class="popup-box" style="padding:0;overflow:hidden;">

<!-- HEADER -->
<div style="
display:flex;
justify-content:space-between;
align-items:center;
padding:12px 16px;
border-bottom:1px solid #eee;
">
<b>Chat</b>
<button onclick="toggleChat()" style="border:none;background:none;font-size:18px;cursor:pointer;">✕</button>
</div>

<!-- BODY -->
<div style="display:flex;height:400px;">

<!-- USERS -->
<div id="chatUsers" style="width:30%;border-right:1px solid #eee;overflow-y:auto;padding:10px;"></div>

<!-- CHAT -->
<div style="width:70%;display:flex;flex-direction:column;">

<div id="chatMessages" style="flex:1;padding:10px;overflow-y:auto;"></div>

<div style="display:flex;border-top:1px solid #eee;">
<input id="msgInput" style="flex:1;padding:10px;border:none;">
<button class="btn" onclick="sendMsg()">Send</button>
</div>

</div>

</div>

</div>
</div>

<script>

/* DATABASE */
let db = JSON.parse(localStorage.getItem("db")) || {
applications:[],
chats:{}
};

function saveDB(){
localStorage.setItem("db",JSON.stringify(db));
}

/* JOBS */
const baseLat=12.68;
const baseLng=101.28;

const jobs=Array.from({length:10},(_,i)=>({
title:["Barista","Retail","Hotel","Waiter","Cleaner","Delivery","Dog Walker","Spa","Cashier","Kitchen"][i],
company:["Cafe Amazon","Central Mall","Hilton","Beach Restaurant","CleanCo","Food Delivery","Happy Paws","Spa","7-Eleven","Seafood Kitchen"][i],
pay:400+i*50,
rating:4+Math.random(),
reviews:Math.floor(Math.random()*50),
lat:baseLat+(Math.random()-0.5)/50,
lng:baseLng+(Math.random()-0.5)/50,
img:`https://source.unsplash.com/800x500/?job,${i}`
}));

let currentChat=null;
let mapOpen=false;

/* RENDER JOBS */
function renderJobs(list){
jobList.innerHTML=list.map(j=>`
<div class="card">
<img src="${j.img}">
<b>${j.title}</b><br>
${j.company}<br>
฿${j.pay}<br>
<div class="stars">${"★".repeat(Math.floor(j.rating))}</div>

<button class="btn" onclick="viewLocation(${j.lat},${j.lng},'${j.company}','${j.title}')">Location</button>
<button class="btn" onclick='applyJob(${JSON.stringify(j)})'>Apply</button>

</div>
`).join("");
}

/* MAP */
function viewLocation(lat,lng,company,title){
if(mapOpen){
mapContainer.innerHTML="";
mapOpen=false;
return;
}

mapContainer.innerHTML=`
<iframe width="100%" height="400"
src="https://www.google.com/maps?q=${lat},${lng}&output=embed"></iframe>

<div style="padding:10px;">
<b>${company}</b><br>${title}
</div>
`;

mapOpen=true;
}

/* APPLY */
function applyJob(job){
db.applications.push({job,status:"pending"});
saveDB();
renderApps();
renderUsers();
}

/* APPLICATION GRID */
function renderApps(){
appList.innerHTML=`
<div class="apps-grid">
${db.applications.map(a=>`
<div class="app-card">
<b>${a.job.title}</b><br>
${a.job.company}<br>
${a.status}
</div>
`).join("")}
</div>`;
}

function toggleApps(){
appsPopup.style.display=appsPopup.style.display==="flex"?"none":"flex";
renderApps();
}

/* CHAT */
function toggleChat(){
chatPopup.style.display=chatPopup.style.display==="flex"?"none":"flex";
renderUsers();
}

function renderUsers(){
chatUsers.innerHTML=db.applications.map(a=>`
<div onclick="openChat('${a.job.company}')"
style="padding:10px;background:white;margin-bottom:6px;border-radius:10px;cursor:pointer;">
${a.job.company}
</div>
`).join("");
}

function openChat(name){
currentChat=name;

chatMessages.innerHTML=(db.chats[name]||[]).map(m=>`
<div class="msg ${m.type}">${m.text}</div>
`).join("");

chatMessages.scrollTop=chatMessages.scrollHeight;
}

function sendMsg(){
let text=msgInput.value;
if(!text)return;

if(!db.chats[currentChat])db.chats[currentChat]=[];

db.chats[currentChat].push({text,type:"user"});
db.chats[currentChat].push({text:"Reply soon",type:"business"});

saveDB();
msgInput.value="";
openChat(currentChat);
}

/* SEARCH */
function searchJobs(q){
renderJobs(jobs.filter(j=>j.title.toLowerCase().includes(q.toLowerCase())));
}

/* INIT */
renderJobs(jobs);

</script>

</body>
</html>
